<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Texto</title>

<link rel="stylesheet"
href="../../css/style.css">

</head>

<body>

<main class="page-content">

<div class="category-header">

<h1 id="tituloPost"
class="category-title">

Carregando...

</h1>

<a href="../../textos/index.html"
class="back-link">

VOLTAR

</a>

</div>

<div id="conteudoTexto">

</div>

</main>

<script>

const params =
new URLSearchParams(
window.location.search
);

const id =
params.get("id");

async function carregarTexto(){

const response =
await fetch(
"../../data/textos.json"
);

const textos =
await response.json();

const texto =
textos.find(
item=>item.id===id
);

if(!texto){

document
.getElementById(
"conteudoTexto"
)
.innerHTML =
"<h2>Publicação não encontrada.</h2>";

return;

}

document
.getElementById(
"tituloPost"
)
.textContent =
texto.titulo;

const area =
document
.getElementById(
"conteudoTexto"
);

area.innerHTML =

`
<p>
Autor:
${texto.autor}
</p>

<p>
Data:
${texto.data}
</p>

<hr>
`;

texto.conteudo
.forEach(paragrafo=>{

area.innerHTML +=

`
<p>

${paragrafo}

</p>
`;

});

}

carregarTexto();

</script>

</body>

</html>
