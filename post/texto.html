<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Texto | SKNO</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="page-content">
    <div class="category-header">
      <h1 id="tituloPost" class="category-title">Carregando...</h1>
      <a href="../TEXTOS/index.html" class="back-link">VOLTAR</a>
    </div>

    <div id="conteudoTexto"></div>
  </main>

  <script>
    const id = new URLSearchParams(window.location.search).get("id");

    async function carregarTexto() {
      const response = await fetch("../data/textos.json");
      const textos = await response.json();
      const texto = textos.find((item) => item.id === id);
      const area = document.getElementById("conteudoTexto");

      if (!texto) {
        document.getElementById("tituloPost").textContent = "Publicação não encontrada";
        const message = document.createElement("p"); message.textContent = "Não foi possível encontrar esta publicação."; area.replaceChildren(message);
        return;
      }

      document.getElementById("tituloPost").textContent = texto.titulo;
      document.title = `${texto.titulo} | SKNO`;

      area.replaceChildren();
      const meta = document.createElement("div"); meta.className = "post-meta";
      const author = document.createElement("p"); author.textContent = `Autor: ${texto.autor || "Não informado"}`;
      const date = document.createElement("p"); date.textContent = `Data: ${texto.data || "Sem data"}`;
      meta.append(author, date); area.append(meta, document.createElement("hr"));

      texto.conteudo.forEach((paragrafo) => {
        const p = document.createElement("p");
        p.textContent = paragrafo;
        area.appendChild(p);
      });
    }

    carregarTexto().catch((error) => {
      console.error(error);
      document.getElementById("tituloPost").textContent = "Erro ao carregar";
    });
  </script>
</body>
</html>
