<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filme | SKNO</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="page-content">
    <div class="category-header">
      <h1 id="tituloFilme" class="category-title">Carregando...</h1>
      <a href="../FILMES/index.html" class="back-link">VOLTAR</a>
    </div>

    <div id="conteudoFilme"></div>
  </main>

  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    const assetPath = (path) => path && !path.startsWith("http") ? `../${path}` : path;

    async function carregarFilme() {
      const response = await fetch("../data/filmes.json");
      const filmes = await response.json();
      const filme = filmes.find((item) => item.id === id);
      const area = document.getElementById("conteudoFilme");

      if (!filme) {
        document.getElementById("tituloFilme").textContent = "Publicação não encontrada";
        const message = document.createElement("p"); message.textContent = "Não foi possível encontrar esta publicação."; area.replaceChildren(message);
        return;
      }

      document.getElementById("tituloFilme").textContent = filme.titulo;
      document.title = `${filme.titulo} | SKNO`;
      area.replaceChildren();
      if (filme.poster) { const poster = document.createElement("img"); poster.className = "post-cover"; poster.src = assetPath(filme.poster); poster.alt = filme.titulo; area.appendChild(poster); }
      const video = document.createElement("video"); video.className = "post-video"; video.controls = true;
      const source = document.createElement("source"); source.src = assetPath(filme.video); video.appendChild(source); area.appendChild(video);
    }

    carregarFilme().catch((error) => {
      console.error(error);
      document.getElementById("tituloFilme").textContent = "Erro ao carregar";
    });
  </script>
</body>
</html>
