<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arte | SKNO</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="page-content">
    <div class="category-header">
      <h1 id="tituloPost" class="category-title">Carregando...</h1>
      <a href="../ARTES/index.html" class="back-link">VOLTAR</a>
    </div>

    <div id="conteudoArte"></div>
  </main>

  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    const assetPath = (path) => path && !path.startsWith("http") ? `../${path}` : path;

    async function carregarArte() {
      const response = await fetch("../data/artes.json");
      if (!response.ok) throw new Error(`Falha ao carregar: ${response.status}`);
      const artes = await response.json();
      const arte = artes.find((item) => item.id === id);
      const area = document.getElementById("conteudoArte");

      if (!arte) {
        document.getElementById("tituloPost").textContent = "Publicação não encontrada";
        const message = document.createElement("p"); message.textContent = "Não foi possível encontrar esta publicação."; area.replaceChildren(message);
        return;
      }

      document.getElementById("tituloPost").textContent = arte.titulo;
      document.title = `${arte.titulo} | SKNO`;

      area.replaceChildren();
      const meta = document.createElement("div"); meta.className = "post-meta";
      const author = document.createElement("p"); author.textContent = `Autor: ${arte.autor || "Não informado"}`;
      const text = document.createElement("p"); text.textContent = arte.texto || "";
      meta.appendChild(author); area.append(meta, text);

      (arte.imagens || []).forEach((imagem) => {
        const img = document.createElement("img");
        img.className = "post-image";
        img.src = assetPath(imagem);
        img.alt = arte.titulo;
        area.appendChild(img);
      });
    }

    carregarArte().catch((error) => {
      console.error(error);
      document.getElementById("tituloPost").textContent = "Erro ao carregar";
    });
  </script>
</body>
</html>
