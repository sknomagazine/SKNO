<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Álbum</title>

<link rel="stylesheet"
href="../../css/style.css">

</head>

<body>

<main class="page-content">

<div class="category-header">

<h1 id="tituloAlbum">
Carregando...
</h1>

<a href="../../musicas/index.html"
class="back-link">

VOLTAR

</a>

</div>

<div id="conteudoAlbum"></div>

</main>

<script>

const id =
new URLSearchParams(
window.location.search
).get("id");

async function carregarAlbum(){

const response =
await fetch(
"../../data/musicas.json"
);

const albuns =
await response.json();

const album =
albuns.find(
a=>a.id===id
);

if(!album)return;

document
.getElementById(
"tituloAlbum"
)
textContent =
album.titulo;

let html =

`
<img
src="${album.capa}"
style="max-width:400px;">
`;

album.faixas
.forEach(f=>{

html +=

`
<h3>${f.titulo}</h3>

<audio controls>

<source
src="${f.arquivo}">

</audio>
`;

});

document
.getElementById(
"conteudoAlbum"
)
innerHTML = html;

}

carregarAlbum();

</script>

</body>

</html>
