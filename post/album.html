<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Álbum | SKNO</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <main class="page-content">
    <div class="category-header">
      <h1 id="tituloAlbum" class="category-title">Carregando...</h1>
      <a href="../MUSICAS/index.html" class="back-link">VOLTAR</a>
    </div>

    <div id="conteudoAlbum"></div>
  </main>

  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    const assetPath = (path) => path && !path.startsWith("http") ? `../${path}` : path;

    async function carregarAlbum() {
      const response = await fetch("../data/musicas.json");
      const albuns = await response.json();
      const album = albuns.find((item) => item.id === id);
      const area = document.getElementById("conteudoAlbum");

      if (!album) {
        document.getElementById("tituloAlbum").textContent = "Publicação não encontrada";
        const message = document.createElement("p"); message.textContent = "Não foi possível encontrar esta publicação."; area.replaceChildren(message);
        return;
      }

      document.getElementById("tituloAlbum").textContent = album.titulo;
      document.title = `${album.titulo} | SKNO`;

      area.replaceChildren();
      if (album.capa) { const cover = document.createElement("img"); cover.className = "post-cover"; cover.src = assetPath(album.capa); cover.alt = album.titulo; area.appendChild(cover); }

      (album.faixas || []).forEach((faixa) => {
        const title = document.createElement("h3"); title.textContent = faixa.titulo;
        const audio = document.createElement("audio"); audio.className = "post-audio"; audio.controls = true;
        const source = document.createElement("source"); source.src = assetPath(faixa.arquivo); audio.appendChild(source); area.append(title, audio);
      });
    }

    carregarAlbum().catch((error) => {
      console.error(error);
      document.getElementById("tituloAlbum").textContent = "Erro ao carregar";
    });
  </script>
</body>
</html>
